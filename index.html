<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI8MyDad</title>

  <style>
    html, body {
      height: 100%;
      margin: 0;
      background: #0b0f0b;
      color: #e6e6e6;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .container {
      min-height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 24px;
      gap: 20px;
    }

    .image {
      max-width: 100%;
      max-height: 60vh;
      object-fit: contain;
    }

    .copy {
      max-width: 520px;
      font-size: 1.1rem;
      line-height: 1.5;
    }

    .contact {
      margin-top: 6px;
      font-weight: 600;
    }

    a {
      color: inherit;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="container">

    <img
      src="bleedout.gif"
      alt="Snowy, empty walkway at night"
      class="image"
    />

    <div class="copy">
      A private place to vent<br />
      and get grounded feedback<br />
      when you don’t have someone to talk to.
    </div>

    <div class="contact">
      <a href="https://wa.me/1XXXXXXXXXX">
        Text or call: +1&nbsp;XXX&nbsp;XXX&nbsp;XXXX
      </a>
    </div>

  </div>
</body>
</html>
