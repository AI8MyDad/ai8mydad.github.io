<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI8MyDad</title>

  <style>
    :root{
      --bg: #070A0C;
      --text: #E6E6E6;
      --muted: #A9B0B6;
      --accent: #8FAFD8; /* muted cold blue */
      --border: rgba(255,255,255,.08);
    }

    html, body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    }

    .wrap {
      padding: 24px;
      max-width: 560px;
    }

    .img {
      width: 220px;
      max-width: 100%;
      border: 1px solid var(--border);
      border-radius: 10px;
      margin-bottom: 18px;
      display: block;
    }

    .title {
      font-size: 1.25rem;
      margin: 0 0 10px 0;
      color: var(--text);
      letter-spacing: 0.2px;
    }

    .tagline {
      margin: 0 0 18px 0;
      font-size: 1.0rem;
      line-height: 1.55;
    }

    .cta {
      margin: 0 0 18px 0;
      font-size: 1.0rem;
    }

    .cta a {
      color: var(--accent);
      text-decoration: none;
      border-bottom: 1px dashed rgba(143,175,216,.45);
      padding-bottom: 1px;
    }

    .cta a:hover {
      border-bottom-color: rgba(143,175,216,.9);
    }

    .meta {
      margin: 0;
      color: var(--muted);
      font-size: 0.95rem;
      line-height: 1.55;
    }
  </style>
</head>

<body>
  <div class="wrap">

    <img
      class="img"
      src="bleedout.gif"
      alt="Snow falling on an empty walkway at night"
    />

    <h1 class="title">AI8MyDad</h1>

    <p class="tagline">
      The advice you didn’t get, without the lecture.
    </p>

    <p class="cta">
      Text on WhatsApp:
      <a href="https://wa.me/1XXXXXXXXXX">+1&nbsp;XXX&nbsp;XXX&nbsp;XXXX</a>
    </p>

    <p class="meta">
      AI chatbot on WhatsApp.<br />
      30 messages per day free.<br />
      200 messages per day for $5/month.
    </p>

  </div>
</body>
</html>
